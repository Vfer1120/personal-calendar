services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/calendar-attachments;
      mc anonymous set none local/calendar-attachments;
      exit 0;
      "

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://calendar:${POSTGRES_PASSWORD}@postgres:5432/calendar
    volumes:
      - ./packages/db/migrations:/migrations:ro
    command: ["sh", "-c", "for file in /migrations/*.sql; do psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f \"$$file\"; done"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: https://${DOMAIN}
      BETTER_AUTH_URL: https://${DOMAIN}
      CORS_ORIGIN: https://${DOMAIN}
      DATABASE_URL: postgres://calendar:${POSTGRES_PASSWORD}@postgres:5432/calendar
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      OWNER_EMAIL: ${OWNER_EMAIL}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_ACCESS_PASSWORD: ${DEMO_ACCESS_PASSWORD:-}
      DEMO_SESSION_TTL_HOURS: ${DEMO_SESSION_TTL_HOURS:-24}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: calendar-attachments
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ATTACHMENT_MASTER_KEY: ${ATTACHMENT_MASTER_KEY}
      MAX_ATTACHMENT_MB: 25
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-Calendar <calendar@example.com>}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      DEFAULT_TIMEZONE: Asia/Shanghai
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://calendar:${POSTGRES_PASSWORD}@postgres:5432/calendar
      APP_URL: https://${DOMAIN}
      OWNER_EMAIL: ${OWNER_EMAIL}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_ACCESS_PASSWORD: ${DEMO_ACCESS_PASSWORD:-}
      DEMO_SESSION_TTL_HOURS: ${DEMO_SESSION_TTL_HOURS:-24}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-Calendar <calendar@example.com>}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      ATTACHMENT_MASTER_KEY: ${ATTACHMENT_MASTER_KEY}
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAILY: 7
      BACKUP_RETENTION_WEEKLY: 4
      BACKUP_RETENTION_MONTHLY: 12
    volumes:
      - backup-data:/app/backups

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose: ["80"]

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  minio-data:
  backup-data:
  caddy-data:
  caddy-config: